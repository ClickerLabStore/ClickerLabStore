<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClickerLabStore</title>

    <style>

        /* =========================
           GENERAL
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            overflow-x: hidden;
        }


        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            width: 100%;
        }

        .navbar-image {
            position: relative;
            width: 100%;
        }

        .navbar-main-image {
            display: block;
            width: 100%;
            height: auto;
        }


        /* =========================
           NAVBAR BUTTONS
        ========================== */

        .nav-click {
            position: absolute;
            display: block;
            cursor: pointer;
        }


        /* =========================
           LOGO
        ========================== */

        .logo {
            position: absolute;

            left: 1.5%;
            width: 23.5%;

            top: 5%;
            height: 90%;

            z-index: 10;

            cursor: pointer;

            overflow: hidden;

            transition: transform 0.2s ease;

            transform-origin: center;
        }


        .logo img {
            position: absolute;

            width: 425.53%;

            max-width: none;

            left: -6.38%;
            top: -5.56%;

            display: block;
        }


        .logo:hover {
            transform: scale(1.02);
        }


        /* =========================
           SHOP
        ========================== */

        .shop {
            left: 26.5%;
            top: 28%;
            width: 5.5%;
            height: 45%;
        }


        /* =========================
           BUNDLES
        ========================== */

        .bundles {
            left: 34.2%;
            top: 28%;
            width: 7.8%;
            height: 45%;
        }


        /* =========================
           BUILD YOUR OWN
        ========================== */

        .build {
            left: 44.1%;
            top: 28%;
            width: 13.1%;
            height: 45%;
        }


        /* =========================
           ABOUT
        ========================== */

        .about {
            left: 59.4%;
            top: 28%;
            width: 5.9%;
            height: 45%;
        }


        /* =========================
           FAQ
        ========================== */

        .faq {
            left: 67.5%;
            top: 28%;
            width: 4.3%;
            height: 45%;
        }


        /* =========================
           UNDERLINES
        ========================== */

        .nav-click::after {
            content: "";
            position: absolute;

            left: 50%;
            bottom: 16%;

            height: 2px;

            background-color: black;

            transform: translateX(-50%) scaleX(0);

            transform-origin: center;

            transition: transform 0.2s ease;
        }


        .shop::after,
        .bundles::after {
            width: 90%;
        }


        .build::after {
            width: 96%;
        }


        .about::after {
            width: 90%;
            left: 46%;
        }


        .faq::after {
            width: 90%;
            left: 61%;
        }


        .nav-click:hover::after {
            transform: translateX(-50%) scaleX(1);
        }


        /* =========================
           HOMEPAGE
        ========================== */

        .home {
            padding: 55px 0 80px 0;
        }


        .home-title {
            text-align: center;
            padding: 0 20px 35px 20px;
        }


        .home-title h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }


        .home-title p {
            font-size: 18px;
        }


        /* =========================
           MOVING PHOTO GALLERY
        ========================== */

        .gallery {
            width: 100%;
            overflow: hidden;

            padding: 20px 0 30px 0;
        }


        .gallery-track {
            display: flex;

            width: max-content;

            gap: 22px;

            animation: gallerySlide 35s linear infinite;
        }


        .gallery:hover .gallery-track {
            animation-play-state: paused;
        }


        .gallery img {
            width: 280px;
            height: 380px;

            object-fit: cover;

            border-radius: 18px;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.15);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            flex-shrink: 0;
        }


        .gallery img:hover {
            transform: scale(1.03);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.22);
        }


        /* =========================
           GALLERY ANIMATION
        ========================== */

        @keyframes gallerySlide {

            from {
                transform: translateX(-50%);
            }

            to {
                transform: translateX(0);
            }

        }


        /* =========================
           SMALLER SCREENS
        ========================== */

        @media (max-width: 700px) {

            .home-title h1 {
                font-size: 32px;
            }

            .gallery img {
                width: 210px;
                height: 290px;
            }

            .gallery-track {
                gap: 15px;
                animation-duration: 30s;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="navbar-image">


            <!-- MAIN NAVBAR -->

            <img
                src="navbar.png"
                alt="ClickerLabStore navigation bar"
                class="navbar-main-image"
            >


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
                aria-label="ClickerLabStore Home"
            >

                <img
                    src="navbar.png"
                    alt=""
                >

            </a>


            <!-- SHOP -->

            <a
                href="shop.html"
                class="nav-click shop"
                aria-label="Shop"
            ></a>


            <!-- BUNDLES -->

            <a
                href="bundles.html"
                class="nav-click bundles"
                aria-label="Bundles"
            ></a>


            <!-- BUILD YOUR OWN -->

            <a
                href="build.html"
                class="nav-click build"
                aria-label="Build Your Own"
            ></a>


            <!-- ABOUT -->

            <a
                href="about.html"
                class="nav-click about"
                aria-label="About"
            ></a>


            <!-- FAQ -->

            <a
                href="faq.html"
                class="nav-click faq"
                aria-label="FAQ"
            ></a>


        </div>

    </header>


    <!-- =========================
         HOMEPAGE
    ========================== -->

    <main class="home">


        <!-- TITLE -->

        <section class="home-title">

            <h1>Welcome to ClickerLabStore!</h1>

            <p>
                Mechanical keyboard fidgets made to click anywhere.
            </p>

        </section>


        <!-- =========================
             MOVING GALLERY
        ========================== -->

        <section class="gallery">

            <div class="gallery-track">


                <!-- FIRST SET -->

                <img src="gallery1.png" alt="ClickerLab keyboard fidget">

                <img src="gallery2.png" alt="ClickerLab keyboard fidgets">

                <img src="gallery3.png" alt="ClickerLab keychain fidgets">

                <img src="gallery4.png" alt="ClickerLab keycaps and fidgets">

                <img src="gallery5.png" alt="Single ClickerLab keychain">

                <img src="gallery6.png" alt="Three key ClickerLab keychain">

                <img src="gallery7.png" alt="ClickerLab three key fidget">

                <img src="gallery8.png" alt="ClickerLab single key fidget">


                <!-- SECOND SET FOR LOOP -->

                <img src="gallery1.png" alt="">

                <img src="gallery2.png" alt="">

                <img src="gallery3.png" alt="">

                <img src="gallery4.png" alt="">

                <img src="gallery5.png" alt="">

                <img src="gallery6.png" alt="">

                <img src="gallery7.png" alt="">

                <img src="gallery8.png" alt="">


            </div>

        </section>


    </main>


</body>

</html>
