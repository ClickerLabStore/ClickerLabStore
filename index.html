<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ClickerLabStore</title>


    <!-- =========================
         FAVICON
    ========================== -->

    <link
        rel="icon"
        type="image/png"
        href="/favicon.png?v=2"
    >


    <!-- =========================
         NUNITO SANS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family:
                "Nunito Sans",
                sans-serif;

            background: white;

            color: #17243c;

            overflow-x: hidden;
        }


        /* =========================
           NEW NAVBAR
        ========================== */

        .navbar {
            width: 100%;

            height: 112px;

            position: relative;

            background-image:
                url("blank navbar.png");

            background-size:
                100% 100%;

            background-position:
                center;

            background-repeat:
                no-repeat;
        }


        .navbar-inner {
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;

            padding:
                0 2.2%;

            gap: 20px;
        }


        /* =========================
           LOGO
        ========================== */

        .navbar-logo {
            display: flex;

            align-items: center;

            width: clamp(
                250px,
                28vw,
                380px
            );

            flex-shrink: 0;

            text-decoration: none;

            transition:
                transform 0.2s ease;
        }


        .navbar-logo:hover {
            transform:
                scale(1.02);
        }


        .navbar-logo img {
            display: block;

            width: 100%;
            height: auto;
        }


        /* =========================
           NAVIGATION TEXT
        ========================== */

        .nav-links {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: clamp(
                18px,
                2.6vw,
                45px
            );

            margin-left: auto;
        }


        .nav-links a {
            position: relative;

            color: #4b2247;

            text-decoration: none;

            font-size: clamp(
                14px,
                1.15vw,
                18px
            );

            font-weight: 800;

            white-space: nowrap;

            padding:
                10px 0;
        }


        /* UNDERLINE */

        .nav-links a::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 3px;

            width: 100%;
            height: 2px;

            background: #4b2247;

            transform:
                translateX(-50%)
                scaleX(0);

            transform-origin:
                center;

            transition:
                transform 0.2s ease;
        }


        .nav-links a:hover::after {
            transform:
                translateX(-50%)
                scaleX(1);
        }


        /* =========================
           SEARCH + CART
        ========================== */

        .nav-actions {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-left:
                clamp(
                    10px,
                    1.4vw,
                    24px
                );

            flex-shrink: 0;
        }


        .nav-icon-button {
            width: 48px;
            height: 48px;

            padding: 0;

            border: none;

            background: transparent;

            border-radius: 12px;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            transition:
                transform 0.2s ease;
        }


        .nav-icon-button:hover {
            transform:
                scale(1.07);
        }


        .nav-icon-button img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;
        }


        /* =========================
           HOME TITLE
        ========================== */

        .home-title {
            text-align: center;

            padding:
                65px 20px 45px;
        }


        .home-title h1 {
            font-size: 42px;

            font-weight: 800;

            margin-bottom: 12px;
        }


        .home-title p {
            font-size: 18px;

            font-weight: 400;

            color: #667085;
        }


        /* =========================
           GALLERY
        ========================== */

        .gallery {
            width: 100%;

            overflow: hidden;

            padding:
                20px 0 80px;
        }


        .gallery-track {
            display: flex;

            width: max-content;

            gap: 22px;

            animation:
                gallerySlide
                35s
                linear
                infinite;
        }


        .gallery:hover
        .gallery-track {
            animation-play-state:
                paused;
        }


        .gallery img {
            width: 280px;
            height: 380px;

            object-fit: cover;

            border-radius: 18px;

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.15);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            flex-shrink: 0;
        }


        .gallery img:hover {
            transform:
                scale(1.03);

            box-shadow:
                0 10px 24px
                rgba(0, 0, 0, 0.18);
        }


        /* =========================
           GALLERY MOVEMENT
        ========================== */

        @keyframes gallerySlide {

            from {
                transform:
                    translateX(-50%);
            }

            to {
                transform:
                    translateX(0);
            }

        }


        /* =========================
           SMALLER LAPTOPS
        ========================== */

        @media (max-width: 1100px) {

            .navbar {
                height: 100px;
            }


            .navbar-logo {
                width: 245px;
            }


            .nav-links {
                gap: 17px;
            }


            .nav-links a {
                font-size: 14px;
            }


            .nav-icon-button {
                width: 43px;
                height: 43px;
            }

        }


        /* =========================
           TABLETS
        ========================== */

        @media (max-width: 850px) {

            .navbar {
                height: auto;

                min-height: 150px;

                background-size:
                    cover;
            }


            .navbar-inner {
                flex-wrap: wrap;

                justify-content:
                    center;

                padding:
                    12px 16px 16px;

                gap: 8px;
            }


            .navbar-logo {
                width: 260px;

                margin-right: auto;
            }


            .nav-actions {
                margin-left: auto;
            }


            .nav-links {
                width: 100%;

                order: 3;

                justify-content:
                    center;

                gap: 22px;

                margin-left: 0;
            }


            .nav-links a {
                font-size: 14px;
            }

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .navbar {
                min-height: 145px;
            }


            .navbar-logo {
                width: 205px;
            }


            .nav-icon-button {
                width: 39px;
                height: 39px;
            }


            .nav-actions {
                gap: 5px;
            }


            .nav-links {
                gap: 13px;

                flex-wrap: wrap;
            }


            .nav-links a {
                font-size: 12px;
            }


            .home-title {
                padding-top: 45px;
            }


            .home-title h1 {
                font-size: 34px;
            }


            .home-title p {
                font-size: 16px;
            }


            .gallery img {
                width: 220px;
                height: 300px;
            }


            .gallery-track {
                gap: 16px;
            }

        }

    </style>

</head>


<body>

                <img

                <img

</body>

</html>
