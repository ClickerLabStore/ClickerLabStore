<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ClickerLabStore</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="/favicon.png?v=2"
    >

    <!-- NUNITO SANS -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Nunito Sans", sans-serif;
            background: white;
            color: #17243c;
            overflow-x: hidden;
        }


        /* =========================
           NAVBAR
           UNCHANGED
        ========================== */

        .navbar {
            width: 100%;
            height: 110px;

            background-image:
                url("blank navbar.png");

            background-size:
                100% 100%;

            background-position:
                center;

            background-repeat:
                no-repeat;
        }

        .navbar-inner {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;

            padding: 0 2.3%;
        }


        /* =========================
           LOGO
        ========================== */

        .navbar-logo {
            display: flex;
            align-items: center;

            width: 310px;

            flex-shrink: 0;

            text-decoration: none;

            transition:
                transform 0.2s ease;
        }

        .navbar-logo:hover {
            transform:
                scale(1.02);
        }

        .navbar-logo img {
            display: block;

            width: 100%;
            height: auto;
        }


        /* =========================
           NAV LINKS
        ========================== */

        .nav-links {
            display: flex;
            align-items: center;

            margin-left: 150px;

            gap: 50px;
        }

        .nav-links a {
            position: relative;

            color: #4b2247;

            text-decoration: none;

            font-size: 23px;
            font-weight: 600;

            white-space: nowrap;

            padding: 10px 0;
        }

        .nav-links a::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 3px;

            width: 100%;
            height: 2px;

            background: #4b2247;

            transform:
                translateX(-50%)
                scaleX(0);

            transform-origin: center;

            transition:
                transform 0.2s ease;
        }

        .nav-links a:hover::after {
            transform:
                translateX(-50%)
                scaleX(1);
        }


        /* =========================
           SEARCH + CART
        ========================== */

        .nav-actions {
            display: flex;
            align-items: center;

            gap: 14px;

            margin-left: auto;
            margin-right: 20px;

            flex-shrink: 0;
        }

        .nav-icon-button {
            width: 72px;
            height: 72px;

            padding: 0;

            border: none;

            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                transform 0.2s ease;
        }

        .nav-icon-button:hover {
            transform:
                scale(1.08);
        }

        .nav-icon-button img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        /* =========================
           HERO
        ========================== */

        .hero {
            width: 100%;

            min-height:
                calc(100vh - 110px);

            background: #ffffff;

            overflow: hidden;
        }

        .hero-inner {
            max-width: 1500px;

            margin: 0 auto;

            padding:
                75px 60px 75px;

            display: grid;

            grid-template-columns:
                1.02fr 0.98fr;

            gap: 55px;

            align-items: center;
        }


        /* =========================
           HERO LEFT
        ========================== */

        .hero-left {
            max-width: 760px;
        }


        /* =========================
           HERO TITLE
        ========================== */

        .hero-title {
            margin-bottom: 28px;

            color: #17243c;

            font-size: 80px;

            font-weight: 900;

            line-height: 1;

            letter-spacing: -2.5px;
        }

        .hero-title-accent {
            display: block;

            color: #ff8067;
        }


        /* =========================
           HERO DESCRIPTION
        ========================== */

        .hero-description {
            max-width: 700px;

            margin-bottom: 38px;

            color: #637698;

            font-size: 22px;

            line-height: 1.55;

            font-weight: 400;
        }


        /* =========================
           HERO BUTTONS
        ========================== */

        .hero-buttons {
            display: flex;

            align-items: center;

            gap: 16px;

            flex-wrap: wrap;
        }

        .hero-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 58px;

            padding:
                0 28px;

            border:
                2px solid #f7e7d1;

            border-radius:
                999px;

            background:
                #f7e7d1;

            color:
                #4b2247;

            text-decoration:
                none;

            font-size:
                19px;

            font-weight:
                800;

            box-shadow:
                0 7px 20px
                rgba(75, 34, 71, 0.08);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .hero-button:hover {
            transform:
                translateY(-3px);

            border-color:
                #e2c8a6;

            box-shadow:
                0 11px 24px
                rgba(75, 34, 71, 0.12);
        }


        /* =========================
           HERO RIGHT
        ========================== */

        .hero-right {
            position: relative;

            min-height: 620px;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        /* =========================
           BEIGE CIRCLE
        ========================== */

        .hero-circle {
            position: absolute;

            width: 300px;
            height: 300px;

            right: 35px;
            top: 150px;

            border-radius: 50%;

            background: #f7e7d1;

            z-index: 1;
        }


        /* =========================
           PRODUCT FRAME
        ========================== */

        .hero-product-card {
            position: relative;

            width: 550px;
            height: 550px;

            z-index: 2;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                18px solid #ffffff;

            border-radius:
                38px;

            background:
                #f7f7f5;

            box-shadow:
                0 22px 50px
                rgba(23, 36, 60, 0.12);

            transform:
                rotate(3deg);
        }

        .hero-product-inner {
            width: 92%;
            height: 92%;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius:
                26px;

            background:
                #f7f7f5;
        }


        /* =========================
           PRODUCT IMAGE
        ========================== */

        .hero-product-image {
            width: 78%;
            height: auto;

            display: block;

            object-fit: contain;

            transform:
                rotate(-3deg);

            transition:
                transform 0.25s ease;
        }

        .hero-product-card:hover
        .hero-product-image {
            transform:
                rotate(-3deg)
                scale(1.04);
        }


        /* =========================
           FLOATING TAG
        ========================== */

        .hero-tag {
            position: absolute;

            right: -15px;
            bottom: 40px;

            z-index: 3;

            max-width: 310px;

            padding:
                16px 23px;

            border:
                7px solid white;

            border-radius:
                20px;

            background:
                #f7e7d1;

            color:
                #4b2247;

            font-size:
                18px;

            line-height:
                1.25;

            font-weight:
                800;

            text-align: center;

            transform:
                rotate(4deg);

            box-shadow:
                0 12px 28px
                rgba(23, 36, 60, 0.1);
        }


        /* =========================
           SMALLER LAPTOPS
        ========================== */

        @media (max-width: 1200px) {

            /* NAVBAR UNCHANGED */

            .navbar-logo {
                width: 260px;
            }

            .nav-links {
                margin-left: 50px;

                gap: 28px;
            }

            .nav-links a {
                font-size: 19px;

                font-weight: 600;
            }

            .nav-icon-button {
                width: 60px;
                height: 60px;
            }

            .nav-actions {
                margin-right: 12px;
            }


            /* HERO */

            .hero-inner {
                padding:
                    60px 35px 65px;

                gap: 25px;
            }

            .hero-title {
                font-size: 65px;
            }

            .hero-description {
                font-size: 20px;
            }

            .hero-product-card {
                width: 450px;
                height: 450px;
            }

            .hero-right {
                min-height: 520px;
            }

            .hero-circle {
                width: 240px;
                height: 240px;

                top: 140px;
            }

            .hero-tag {
                font-size: 16px;

                max-width: 270px;

                padding:
                    13px 18px;
            }

        }


        /* =========================
           TABLET
        ========================== */

        @media (max-width: 900px) {

            /* NAVBAR UNCHANGED */

            .navbar {
                height: auto;

                min-height: 150px;

                background-size: cover;
            }

            .navbar-inner {
                flex-wrap: wrap;

                padding:
                    10px 18px 15px;
            }

            .navbar-logo {
                width: 225px;
            }

            .nav-actions {
                margin-left: auto;
                margin-right: 0;
            }

            .nav-icon-button {
                width: 52px;
                height: 52px;
            }

            .nav-links {
                width: 100%;

                order: 3;

                margin-left: 0;
                margin-top: 5px;

                justify-content: center;

                gap: 25px;
            }

            .nav-links a {
                font-size: 16px;

                font-weight: 600;
            }


            /* HERO */

            .hero {
                min-height: auto;
            }

            .hero-inner {
                grid-template-columns: 1fr;

                padding:
                    50px 25px 70px;
            }

            .hero-left {
                max-width: 100%;
            }

            .hero-title {
                font-size: 64px;
            }

            .hero-right {
                min-height: 520px;
            }

            .hero-product-card {
                width:
                    min(82vw, 470px);

                height:
                    min(82vw, 470px);
            }

            .hero-tag {
                right: 5%;
            }

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            /* NAVBAR UNCHANGED */

            .navbar-logo {
                width: 185px;
            }

            .nav-icon-button {
                width: 46px;
                height: 46px;
            }

            .nav-actions {
                gap: 5px;
            }

            .nav-links {
                gap: 14px;

                flex-wrap: wrap;
            }

            .nav-links a {
                font-size: 14px;

                font-weight: 600;
            }


            /* HERO */

            .hero-inner {
                padding:
                    42px 18px 50px;
            }

            .hero-title {
                font-size: 48px;

                line-height: 1.02;

                letter-spacing: -1.8px;
            }

            .hero-description {
                margin-bottom: 28px;

                font-size: 17px;
            }

            .hero-buttons {
                flex-direction: column;

                align-items: stretch;
            }

            .hero-button {
                width: 100%;

                font-size: 17px;
            }

            .hero-right {
                min-height: 410px;
            }

            .hero-product-card {
                border-width: 12px;

                border-radius: 27px;
            }

            .hero-product-inner {
                border-radius: 18px;
            }

            .hero-circle {
                width: 180px;
                height: 180px;

                right: 15px;
                top: 110px;
            }

            .hero-tag {
                right: 0;

                bottom: 10px;

                max-width: 220px;

                padding:
                    11px 14px;

                border-width: 5px;

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="navbar-inner">


            <!-- LOGO -->

            <a
                href="index.html"
                class="navbar-logo"
                aria-label="ClickerLabStore Home"
            >

                <img
                    src="ClickerLabLogo.png"
                    alt="ClickerLabStore"
                >

            </a>


            <!-- NAVIGATION -->

            <nav class="nav-links">

                <a href="shop.html">
                    Shop
                </a>

                <a href="bundles.html">
                    Bundles
                </a>

                <a href="build.html">
                    Build Your Own
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="faq.html">
                    FAQ
                </a>

            </nav>


            <!-- SEARCH + CART -->

            <div class="nav-actions">

                <button
                    type="button"
                    class="nav-icon-button"
                    id="search-button"
                    aria-label="Search"
                >

                    <img
                        src="search_button_cropped_580x580.png"
                        alt=""
                    >

                </button>


                <button
                    type="button"
                    class="nav-icon-button"
                    id="cart-button"
                    aria-label="Cart"
                >

                    <img
                        src="cart_button_cropped_580x580.png"
                        alt=""
                    >

                </button>

            </div>


        </div>

    </header>


    <!-- =========================
         HERO
    ========================== -->

    <main class="hero">

        <div class="hero-inner">


            <!-- =========================
                 LEFT SIDE
            ========================== -->

            <section class="hero-left">


                <h1 class="hero-title">

                    For fidgety hands

                    <span class="hero-title-accent">
                        and busy brains.
                    </span>

                </h1>


                <p class="hero-description">

                    Shop compact mechanical-key fidgets in 1–4 key
                    designs. Choose your switch and keycaps, or build
                    a setup that fits you.

                </p>


                <div class="hero-buttons">


                    <a
                        href="shop.html"
                        class="hero-button"
                    >
                        Shop clickers →
                    </a>


                    <a
                        href="build.html"
                        class="hero-button"
                    >
                        Build your own
                    </a>


                </div>


            </section>


            <!-- =========================
                 RIGHT SIDE
            ========================== -->

            <section class="hero-right">


                <div class="hero-circle"></div>


                <div class="hero-product-card">

                    <div class="hero-product-inner">

                        <img
                            src="4-key-clicker.png"
                            alt="4-Key Clicker"
                            class="hero-product-image"
                        >

                    </div>

                </div>


                <div class="hero-tag">
                    Choose a quick pick or customize your own!
                </div>


            </section>


        </div>

    </main>


</body>

</html>
