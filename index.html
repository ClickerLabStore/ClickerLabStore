<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClickerLabStore</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        /* Navbar */
        .navbar {
            width: 100%;
        }

        .navbar img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Temporary homepage content */
        .home {
            text-align: center;
            padding: 80px 20px;
        }

        .home h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .home p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <img src="navbar.png" alt="ClickerLabStore navigation bar">
    </header>

    <!-- HOMEPAGE -->
    <main class="home">
        <h1>Welcome to ClickerLabStore!</h1>
        <p>Our mechanical keyboard fidgets are coming soon.</p>
    </main>

</body>
</html>
