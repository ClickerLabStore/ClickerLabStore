<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ClickerLabStore</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="/favicon.png?v=2"
    >

    <!-- NUNITO SANS -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Nunito Sans", sans-serif;
            background: white;
            color: #17243c;
            overflow-x: hidden;
        }


        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            width: 100%;
            height: 110px;

            background-image: url("blank navbar.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .navbar-inner {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;

            padding: 0 2.3%;
        }


        /* =========================
           LOGO
        ========================== */

        .navbar-logo {
            display: flex;
            align-items: center;

            width: 310px;

            flex-shrink: 0;

            text-decoration: none;

            transition: transform 0.2s ease;
        }

        .navbar-logo:hover {
            transform: scale(1.02);
        }

        .navbar-logo img {
            display: block;
            width: 100%;
            height: auto;
        }


        /* =========================
           NAV LINKS
        ========================== */

        .nav-links {
            display: flex;
            align-items: center;

            margin-left: 150px;

            gap: 50px;
        }

        .nav-links a {
            position: relative;

            color: #4b2247;

            text-decoration: none;

            font-size: 23px;
            font-weight: 600;

            white-space: nowrap;

            padding: 10px 0;
        }


        /* =========================
           NAV LINK UNDERLINE
        ========================== */

        .nav-links a::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 3px;

            width: 100%;
            height: 2px;

            background: #4b2247;

            transform:
                translateX(-50%)
                scaleX(0);

            transform-origin: center;

            transition: transform 0.2s ease;
        }

        .nav-links a:hover::after {
            transform:
                translateX(-50%)
                scaleX(1);
        }


        /* =========================
           SEARCH + CART AREA
        ========================== */

        .nav-actions {
            display: flex;
            align-items: center;

            gap: 14px;

            margin-left: auto;
            margin-right: 20px;

            flex-shrink: 0;
        }


        /* =========================
           SEARCH + CART BUTTONS
        ========================== */

        .nav-icon-button {
            width: 72px;
            height: 72px;

            padding: 0;

            border: none;

            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: transform 0.2s ease;
        }

        .nav-icon-button:hover {
            transform: scale(1.08);
        }

        .nav-icon-button img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        /* =========================
           HOME TITLE
        ========================== */

        .home-title {
            text-align: center;

            padding: 65px 20px 45px;
        }

        .home-title h1 {
            font-size: 42px;
            font-weight: 800;

            margin-bottom: 12px;
        }

        .home-title p {
            font-size: 18px;
            font-weight: 400;

            color: #667085;
        }


        /* =========================
           GALLERY
        ========================== */

        .gallery {
            width: 100%;

            overflow: hidden;

            padding: 20px 0 80px;
        }

        .gallery-track {
            display: flex;

            width: max-content;

            gap: 22px;

            animation:
                gallerySlide
                35s
                linear
                infinite;
        }

        .gallery:hover .gallery-track {
            animation-play-state: paused;
        }

        .gallery img {
            width: 280px;
            height: 380px;

            object-fit: cover;

            border-radius: 18px;

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.15);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            flex-shrink: 0;
        }

        .gallery img:hover {
            transform: scale(1.03);

            box-shadow:
                0 10px 24px
                rgba(0, 0, 0, 0.18);
        }


        /* =========================
           GALLERY ANIMATION
        ========================== */

        @keyframes gallerySlide {

            from {
                transform: translateX(-50%);
            }

            to {
                transform: translateX(0);
            }

        }


        /* =========================
           SMALLER LAPTOPS
        ========================== */

        @media (max-width: 1200px) {

            .navbar-logo {
                width: 260px;
            }

            .nav-links {
                margin-left: 50px;
                gap: 28px;
            }

            .nav-links a {
                font-size: 19px;
                font-weight: 600;
            }

            .nav-icon-button {
                width: 60px;
                height: 60px;
            }

            .nav-actions {
                margin-right: 12px;
            }

        }


        /* =========================
           TABLETS
        ========================== */

        @media (max-width: 900px) {

            .navbar {
                height: auto;
                min-height: 150px;

                background-size: cover;
            }

            .navbar-inner {
                flex-wrap: wrap;

                padding: 10px 18px 15px;
            }

            .navbar-logo {
                width: 225px;
            }

            .nav-actions {
                margin-left: auto;
                margin-right: 0;
            }

            .nav-icon-button {
                width: 52px;
                height: 52px;
            }

            .nav-links {
                width: 100%;

                order: 3;

                margin-left: 0;
                margin-top: 5px;

                justify-content: center;

                gap: 25px;
            }

            .nav-links a {
                font-size: 16px;
                font-weight: 600;
            }

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .navbar-logo {
                width: 185px;
            }

            .nav-icon-button {
                width: 46px;
                height: 46px;
            }

            .nav-actions {
                gap: 5px;
            }

            .nav-links {
                gap: 14px;

                flex-wrap: wrap;
            }

            .nav-links a {
                font-size: 14px;
                font-weight: 600;
            }

            .home-title {
                padding-top: 45px;
            }

            .home-title h1 {
                font-size: 34px;
            }

            .home-title p {
                font-size: 16px;
            }

            .gallery img {
                width: 220px;
                height: 300px;
            }

            .gallery-track {
                gap: 16px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="navbar-inner">


            <!-- LOGO -->

            <a

            </div>


        </div>

    <!-- =========================
         HOMEPAGE
    ========================== -->

    <main>


        <!-- TITLE -->

        <section class="home-title">

            <h1>
                Welcome to ClickerLabStore!
            </h1>

            <p>
                Mechanical keyboard fidgets made to click anywhere.
            </p>

        </section>


        <!-- =========================

        ========================== -->

        <section class="gallery">

            <div class="gallery-track">


                <!-- FIRST SET -->

                <img

                <img

                >

                <img
                    src="gallery3.png"

                >

                <img
                    src="gallery4.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery5.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery6.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery7.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery8.png"
                    alt="ClickerLabStore product"
                >


                <!-- DUPLICATE SET -->

                <img
                    src="gallery1.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery2.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery3.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery4.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery5.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery6.png"

                >

                <img

                <img

</body>

</html>
