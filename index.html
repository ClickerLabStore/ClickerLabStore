<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickerLabStore</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2">

    <!-- NUNITO SANS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Nunito Sans", sans-serif;
            background: white;
            color: #17243c;
            overflow-x: hidden;
        }

        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            width: 100%;
            height: 110px;
            background-image: url("blank navbar.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .navbar-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 2.3%;
        }

        .navbar-logo {
            display: flex;
            align-items: center;
            width: 310px;
            flex-shrink: 0;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .navbar-logo:hover {
            transform: scale(1.02);
        }

        .navbar-logo img {
            display: block;
            width: 100%;
            height: auto;
        }

        .nav-links {
            display: flex;
            align-items: center;
            margin-left: 190px;
            gap: 54px;
        }

        .nav-links a {
            position: relative;
            color: #4b2247;
            text-decoration: none;
            font-size: 27px;
            font-weight: 600;
            white-space: nowrap;
            padding: 10px 0;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 3px;
            width: 100%;
            height: 2px;
            background: #4b2247;
            transform: translateX(-50%) scaleX(0);
            transform-origin: center;
            transition: transform 0.2s ease;
        }

        .nav-links a:hover::after {
            transform: translateX(-50%) scaleX(1);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
            margin-right: 18px;
            flex-shrink: 0;
        }

        .nav-icon-button {
            width: 76px;
            height: 76px;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .nav-icon-button:hover {
            transform: scale(1.07);
        }

        .nav-icon-button img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* =========================
           HERO SECTION
        ========================== */

        .hero {
            position: relative;
            overflow: hidden;
            min-height: calc(100vh - 110px);
            background:
                radial-gradient(circle at 22% 30%, rgba(255, 219, 108, 0.35), transparent 28%),
                radial-gradient(circle at 82% 32%, rgba(182, 174, 255, 0.22), transparent 24%),
                linear-gradient(90deg, #f7edd2 0%, #fbf6ea 42%, #f7f6fd 100%);
        }

        .hero-inner {
            max-width: 1450px;
            margin: 0 auto;
            padding: 55px 60px 70px;
            display: grid;
            grid-template-columns: 1.02fr 0.98fr;
            gap: 40px;
            align-items: center;
        }

        /* Left side */

        .hero-left {
            max-width: 760px;
            position: relative;
            z-index: 2;
        }

        .hero-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: white;
            color: #17243c;
            border-radius: 999px;
            padding: 12px 22px;
            font-size: 18px;
            font-weight: 800;
            box-shadow: 0 8px 25px rgba(23, 36, 60, 0.08);
            margin-bottom: 30px;
        }

        .hero-pill span:first-child {
            color: #ff7a5d;
            font-size: 18px;
        }

        .hero-title {
            font-size: 108px;
            line-height: 0.92;
            font-weight: 900;
            letter-spacing: -3px;
            color: #17243c;
            margin-bottom: 24px;
        }

        .hero-title .accent {
            display: block;
            color: #ff7c61;
        }

        .hero-text {
            font-size: 25px;
            line-height: 1.45;
            color: #5a7195;
            max-width: 760px;
            margin-bottom: 34px;
        }

        .hero-buttons {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .hero-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 999px;
            padding: 18px 28px;
            font-size: 22px;
            font-weight: 800;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .hero-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .hero-btn-primary {
            background: #ff7c61;
            color: white;
        }

        .hero-btn-secondary {
            background: white;
            color: #17243c;
            box-shadow: 0 8px 25px rgba(23, 36, 60, 0.08);
        }

        /* Right side */

        .hero-right {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 650px;
        }

        .hero-yellow-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #f7d76d;
            border-radius: 50%;
            right: 70px;
            top: 160px;
            z-index: 1;
        }

        .hero-card {
            position: relative;
            width: 560px;
            height: 560px;
            background: rgba(255, 255, 255, 0.55);
            border: 18px solid rgba(255, 255, 255, 0.75);
            border-radius: 38px;
            box-shadow: 0 22px 50px rgba(23, 36, 60, 0.08);
            transform: rotate(4deg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            backdrop-filter: blur(2px);
        }

        .hero-card-inner {
            width: 92%;
            height: 92%;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.34);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-product-image {
            width: 70%;
            max-width: 390px;
            height: auto;
            display: block;
            transform: rotate(-4deg);
        }

        .hero-tag {
            position: absolute;
            right: 20px;
            bottom: 48px;
            z-index: 3;
            background: #bfe8d5;
            color: #17243c;
            border: 7px solid rgba(255, 255, 255, 0.9);
            border-radius: 22px;
            padding: 18px 28px;
            font-size: 22px;
            font-weight: 900;
            transform: rotate(6deg);
            box-shadow: 0 14px 26px rgba(23, 36, 60, 0.10);
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 1400px) {
            .hero-title {
                font-size: 92px;
            }

            .hero-text {
                font-size: 22px;
            }

            .hero-card {
                width: 500px;
                height: 500px;
            }
        }

        @media (max-width: 1200px) {
            .navbar-logo {
                width: 260px;
            }

            .nav-links {
                margin-left: 70px;
                gap: 28px;
            }

            .nav-links a {
                font-size: 21px;
                font-weight: 600;
            }

            .nav-icon-button {
                width: 62px;
                height: 62px;
            }

            .nav-actions {
                margin-right: 12px;
            }

            .hero-inner {
                padding: 50px 35px 70px;
                gap: 20px;
            }

            .hero-title {
                font-size: 78px;
            }

            .hero-text {
                font-size: 20px;
            }

            .hero-btn {
                font-size: 19px;
                padding: 16px 24px;
            }

            .hero-card {
                width: 440px;
                height: 440px;
            }

            .hero-tag {
                font-size: 18px;
                padding: 14px 20px;
            }

            .hero-yellow-circle {
                width: 240px;
                height: 240px;
                right: 55px;
                top: 165px;
            }
        }

        @media (max-width: 900px) {
            .navbar {
                height: auto;
                min-height: 150px;
                background-size: cover;
            }

            .navbar-inner {
                flex-wrap: wrap;
                padding: 10px 18px 15px;
            }

            .navbar-logo {
                width: 225px;
            }

            .nav-actions {
                margin-left: auto;
                margin-right: 0;
            }

            .nav-icon-button {
                width: 52px;
                height: 52px;
            }

            .nav-links {
                width: 100%;
                order: 3;
                margin-left: 0;
                margin-top: 5px;
                justify-content: center;
                gap: 24px;
            }

            .nav-links a {
                font-size: 16px;
                font-weight: 600;
            }

            .hero {
                min-height: auto;
            }

            .hero-inner {
                grid-template-columns: 1fr;
                padding: 40px 24px 60px;
            }

            .hero-left {
                max-width: 100%;
            }

            .hero-title {
                font-size: 68px;
            }

            .hero-text {
                font-size: 19px;
            }

            .hero-right {
                min-height: 520px;
            }

            .hero-card {
                width: min(92vw, 470px);
                height: min(92vw, 470px);
            }

            .hero-tag {
                right: 10px;
                bottom: 20px;
                font-size: 16px;
            }
        }

        @media (max-width: 600px) {
            .navbar-logo {
                width: 185px;
            }

            .nav-icon-button {
                width: 46px;
                height: 46px;
            }

            .nav-actions {
                gap: 5px;
            }

            .nav-links {
                gap: 14px;
                flex-wrap: wrap;
            }

            .nav-links a {
                font-size: 14px;
                font-weight: 600;
            }

            .hero-inner {
                padding: 30px 18px 45px;
            }

            .hero-pill {
                font-size: 14px;
                padding: 10px 16px;
                margin-bottom: 20px;
            }

            .hero-title {
                font-size: 52px;
                letter-spacing: -2px;
            }

            .hero-text {
                font-size: 17px;
                margin-bottom: 26px;
            }

            .hero-buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .hero-btn {
                width: 100%;
                font-size: 18px;
                padding: 16px 20px;
            }

            .hero-right {
                min-height: 410px;
            }

            .hero-card {
                border-width: 12px;
                border-radius: 26px;
            }

            .hero-card-inner {
                border-radius: 18px;
            }

            .hero-yellow-circle {
                width: 180px;
                height: 180px;
                right: 20px;
                top: 115px;
            }

            .hero-tag {
                font-size: 14px;
                padding: 12px 16px;
                border-width: 5px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="navbar-inner">

            <a href="index.html" class="navbar-logo" aria-label="ClickerLabStore Home">
                <img src="ClickerLabLogo.png" alt="ClickerLabStore">
            </a>

            <nav class="nav-links">
                <a href="shop.html">Shop</a>
                <a href="bundles.html">Bundles</a>
                <a href="build.html">Build Your Own</a>
                <a href="about.html">About</a>
                <a href="faq.html">FAQ</a>
            </nav>

            <div class="nav-actions">
                <button type="button" class="nav-icon-button" id="search-button" aria-label="Search">
                    <img src="search_button_cropped_580x580.png" alt="">
                </button>

                <button type="button" class="nav-icon-button" id="cart-button" aria-label="Cart">
                    <img src="cart_button_cropped_580x580.png" alt="">
                </button>
            </div>
        </div>
    </header>

    <!-- HERO -->
    <main class="hero">
        <div class="hero-inner">

            <section class="hero-left">
                <div class="hero-pill">
                    <span>⚡</span>
                    <span>Pocket-sized tactile fun</span>
                </div>

                <h1 class="hero-title">
                    Click. Fidget.
                    <span class="accent">Repeat.</span>
                </h1>

                <p class="hero-text">
                    Mechanical-key clickers made for satisfying little breaks.
                    Pick one key for maximum portability or go bigger with a
                    multi-key setup.
                </p>

                <div class="hero-buttons">
                    <a href="shop.html" class="hero-btn hero-btn-primary">
                        Shop clickers →
                    </a>

                    <a href="build.html" class="hero-btn hero-btn-secondary">
                        Build your own
                    </a>
                </div>
            </section>

            <section class="hero-right">
                <div class="hero-yellow-circle"></div>

                <div class="hero-card">
                    <div class="hero-card-inner">
                        <img
                            src="4-key-clicker.png"
                            alt="4-Key Clicker"
                            class="hero-product-image"
                        >
                    </div>
                </div>

                <div class="hero-tag">
                    4 keys = 4× the fun
                </div>
            </section>

        </div>
    </main>

</body>

</html>
