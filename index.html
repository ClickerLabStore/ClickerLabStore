<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClickerLabStore</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2">

    <!-- NUNITO SANS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Nunito Sans", sans-serif;
            background: white;
            color: #17243c;
            overflow-x: hidden;
        }


        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            width: 100%;
        }

        .navbar-image {
            position: relative;
            width: 100%;
        }

        .navbar-main-image {
            display: block;
            width: 100%;
            height: auto;
        }

        .nav-click {
            position: absolute;
            display: block;
            cursor: pointer;
        }


        /* =========================
           LOGO
        ========================== */

        .logo {
            position: absolute;
            left: 1.5%;
            top: 5%;
            width: 23.5%;
            height: 90%;

            overflow: hidden;

            z-index: 10;

            cursor: pointer;

            transition: transform 0.2s ease;
            transform-origin: center;
        }

        .logo img {
            position: absolute;

            width: 425.53%;
            max-width: none;

            left: -6.38%;
            top: -5.56%;
        }

        .logo:hover {
            transform: scale(1.02);
        }


        /* =========================
           NAV BUTTONS
        ========================== */

        .shop {
            left: 26.5%;
            top: 28%;
            width: 5.5%;
            height: 45%;
        }

        .bundles {
            left: 34.2%;
            top: 28%;
            width: 7.8%;
            height: 45%;
        }

        .build {
            left: 44.1%;
            top: 28%;
            width: 13.1%;
            height: 45%;
        }

        .about {
            left: 59.4%;
            top: 28%;
            width: 5.9%;
            height: 45%;
        }

        .faq {
            left: 67.5%;
            top: 28%;
            width: 4.3%;
            height: 45%;
        }


        /* =========================
           NAV UNDERLINES
        ========================== */

        .nav-click::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 16%;

            height: 2px;

            background: black;

            transform:
                translateX(-50%)
                scaleX(0);

            transform-origin: center;

            transition: transform 0.2s ease;
        }

        .shop::after,
        .bundles::after,
        .about::after,
        .faq::after {
            width: 90%;
        }

        .build::after {
            width: 96%;
        }

        .about::after {
            left: 46%;
        }

        .faq::after {
            left: 61%;
        }

        .nav-click:hover::after {
            transform:
                translateX(-50%)
                scaleX(1);
        }


        /* =========================
           HOME TITLE
        ========================== */

        .home-title {
            text-align: center;

            padding:
                65px 20px 45px;
        }

        .home-title h1 {
            font-family:
                "Nunito Sans",
                sans-serif;

            font-size: 42px;

            font-weight: 800;

            margin-bottom: 12px;
        }

        .home-title p {
            font-family:
                "Nunito Sans",
                sans-serif;

            font-size: 18px;

            font-weight: 400;

            color: #667085;
        }


        /* =========================
           GALLERY
        ========================== */

        .gallery {
            width: 100%;

            overflow: hidden;

            padding:
                20px 0 80px;
        }

        .gallery-track {
            display: flex;

            width: max-content;

            gap: 22px;

            animation:
                gallerySlide
                35s
                linear
                infinite;
        }

        .gallery:hover .gallery-track {
            animation-play-state: paused;
        }

        .gallery img {
            width: 280px;
            height: 380px;

            object-fit: cover;

            border-radius: 18px;

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.15);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            flex-shrink: 0;
        }

        .gallery img:hover {
            transform: scale(1.03);

            box-shadow:
                0 10px 24px
                rgba(0, 0, 0, 0.18);
        }


        /* =========================
           GALLERY MOVEMENT
        ========================== */

        @keyframes gallerySlide {

            from {
                transform:
                    translateX(-50%);
            }

            to {
                transform:
                    translateX(0);
            }

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 700px) {

            .home-title {
                padding-top: 45px;
            }

            .home-title h1 {
                font-size: 34px;
            }

            .home-title p {
                font-size: 16px;
            }

            .gallery img {
                width: 220px;
                height: 300px;
            }

            .gallery-track {
                gap: 16px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="navbar-image">

            <img
                src="navbar.png"
                alt="ClickerLabStore navigation bar"
                class="navbar-main-image"
            >


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
                aria-label="ClickerLabStore Home"
            >

                <img
                    src="navbar.png"
                    alt=""
                >

            </a>


            <!-- NAVIGATION LINKS -->

            <a
                href="shop.html"
                class="nav-click shop"
                aria-label="Shop"
            ></a>


            <a
                href="bundles.html"
                class="nav-click bundles"
                aria-label="Bundles"
            ></a>


            <a
                href="build.html"
                class="nav-click build"
                aria-label="Build Your Own"
            ></a>


            <a
                href="about.html"
                class="nav-click about"
                aria-label="About"
            ></a>


            <a
                href="faq.html"
                class="nav-click faq"
                aria-label="FAQ"
            ></a>

        </div>

    </header>


    <!-- =========================
         HOME TITLE
    ========================== -->

    <main>

        <section class="home-title">

            <h1>
                Welcome to ClickerLabStore!
            </h1>

            <p>
                Mechanical keyboard fidgets made to click anywhere.
            </p>

        </section>


        <!-- =========================
             MOVING PHOTO GALLERY
        ========================== -->

        <section class="gallery">

            <div class="gallery-track">


                <!-- FIRST SET -->

                <img
                    src="gallery1.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery2.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery3.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery4.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery5.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery6.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery7.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery8.png"
                    alt="ClickerLabStore product"
                >


                <!-- DUPLICATE SET FOR SMOOTH LOOP -->

                <img
                    src="gallery1.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery2.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery3.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery4.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery5.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery6.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery7.png"
                    alt="ClickerLabStore product"
                >

                <img
                    src="gallery8.png"
                    alt="ClickerLabStore product"
                >


            </div>

        </section>

    </main>


</body>

</html>
