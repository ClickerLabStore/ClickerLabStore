<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClickerLabStore</title>

    <style>

        /* =========================
           GENERAL PAGE SETTINGS
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }


        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            width: 100%;
        }

        .navbar-image {
            position: relative;
            width: 100%;
        }

        .navbar img {
            display: block;
            width: 100%;
            height: auto;
        }


        /* =========================
           INVISIBLE NAVBAR BUTTONS
        ========================== */

        .nav-click {
            position: absolute;
            display: block;
            cursor: pointer;
        }


        /* =========================
           SHOP BUTTON
        ========================== */

        .shop {
            left: 26.5%;
            top: 28%;
            width: 5.5%;
            height: 45%;
        }


        /* =========================
           SHOP HOVER UNDERLINE
        ========================== */

        .shop::after {
            content: "";
            position: absolute;

            /* Center underline */
            left: 50%;

            /* Move underline slightly higher */
            bottom: 16%;

            /* Underline size */
            width: 90%;
            height: 2px;

            background-color: black;

            /* Hide underline normally */
            transform: translateX(-50%) scaleX(0);

            /* Make animation grow from center */
            transform-origin: center;

            /* Smooth animation */
            transition: transform 0.2s ease;
        }


        /* Show underline when hovering over Shop */

        .shop:hover::after {
            transform: translateX(-50%) scaleX(1);
        }


        /* =========================
           HOMEPAGE
        ========================== */

        .home {
            text-align: center;
            padding: 80px 20px;
        }

        .home h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .home p {
            font-size: 18px;
        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="navbar-image">

            <!-- Navbar image -->

            <img
                src="navbar.png"
                alt="ClickerLabStore navigation bar"
            >


            <!-- Invisible Shop button -->

            <a
                href="shop.html"
                class="nav-click shop"
                aria-label="Shop"
            ></a>

        </div>

    </header>



    <!-- =========================
         HOMEPAGE
    ========================== -->

    <main class="home">

        <h1>Welcome to ClickerLabStore!</h1>

        <p>
            Our mechanical keyboard fidgets are coming soon.
        </p>

    </main>


</body>

</html>
