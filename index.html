<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ClickerLabStore</title>

    <style>

        /* =========================
           GENERAL
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }


        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            width: 100%;
        }

        .navbar-image {
            position: relative;
            width: 100%;
        }

        .navbar-main-image {
            display: block;
            width: 100%;
            height: auto;
        }


        /* =========================
           NAVBAR BUTTONS
        ========================== */

        .nav-click {
            position: absolute;
            display: block;
            cursor: pointer;
        }


        /* =========================
           LOGO
        ========================== */

        .logo {
            position: absolute;

            /* Extended farther LEFT */
            left: 1.5%;
            top: 18%;

            /* Wider so the full cat + text is included */
            width: 23.5%;
            height: 64%;

            z-index: 10;

            cursor: pointer;

            overflow: hidden;

            transition: transform 0.2s ease;

            transform-origin: center;
        }


        /* Copy of navbar used for logo */

        .logo img {
            position: absolute;

            width: 425.53%;

            max-width: none;

            left: -6.38%;
            top: -28.1%;

            display: block;
        }


        /* Small smooth hover */

        .logo:hover {
            transform: scale(1.02);
        }


        /* =========================
           SHOP
        ========================== */

        .shop {
            left: 26.5%;
            top: 28%;
            width: 5.5%;
            height: 45%;
        }


        /* =========================
           BUNDLES
        ========================== */

        .bundles {
            left: 34.2%;
            top: 28%;
            width: 7.8%;
            height: 45%;
        }


        /* =========================
           BUILD YOUR OWN
        ========================== */

        .build {
            left: 44.1%;
            top: 28%;
            width: 13.1%;
            height: 45%;
        }


        /* =========================
           ABOUT
        ========================== */

        .about {
            left: 59.4%;
            top: 28%;
            width: 5.9%;
            height: 45%;
        }


        /* =========================
           FAQ
        ========================== */

        .faq {
            left: 67.5%;
            top: 28%;
            width: 4.3%;
            height: 45%;
        }


        /* =========================
           UNDERLINES
        ========================== */

        .nav-click::after {
            content: "";
            position: absolute;

            left: 50%;
            bottom: 16%;

            height: 2px;

            background-color: black;

            transform: translateX(-50%) scaleX(0);

            transform-origin: center;

            transition: transform 0.2s ease;
        }


        /* Shop + Bundles */

        .shop::after,
        .bundles::after {
            width: 90%;
        }


        /* Build Your Own */

        .build::after {
            width: 96%;
        }


        /* About */

        .about::after {
            width: 90%;
            left: 46%;
        }


        /* FAQ */

        .faq::after {
            width: 90%;
            left: 61%;
        }


        /* Show underline */

        .nav-click:hover::after {
            transform: translateX(-50%) scaleX(1);
        }


        /* =========================
           HOMEPAGE
        ========================== */

        .home {
            text-align: center;
            padding: 80px 20px;
        }

        .home h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .home p {
            font-size: 18px;
        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="navbar-image">


            <!-- MAIN NAVBAR -->

            <img
                src="navbar.png"
                alt="ClickerLabStore navigation bar"
                class="navbar-main-image"
            >


            <!-- =========================
                 LOGO
            ========================== -->

            <a
                href="index.html"
                class="logo"
                aria-label="ClickerLabStore Home"
            >

                <img
                    src="navbar.png"
                    alt=""
                >

            </a>


            <!-- =========================
                 SHOP
            ========================== -->

            <a
                href="shop.html"
                class="nav-click shop"
                aria-label="Shop"
            ></a>


            <!-- =========================
                 BUNDLES
            ========================== -->

            <a
                href="bundles.html"
                class="nav-click bundles"
                aria-label="Bundles"
            ></a>


            <!-- =========================
                 BUILD YOUR OWN
            ========================== -->

            <a
                href="build.html"
                class="nav-click build"
                aria-label="Build Your Own"
            ></a>


            <!-- =========================
                 ABOUT
            ========================== -->

            <a
                href="about.html"
                class="nav-click about"
                aria-label="About"
            ></a>


            <!-- =========================
                 FAQ
            ========================== -->

            <a
                href="faq.html"
                class="nav-click faq"
                aria-label="FAQ"
            ></a>


        </div>

    </header>


    <!-- =========================
         HOMEPAGE
    ========================== -->

    <main class="home">

        <h1>Welcome to ClickerLabStore!</h1>

        <p>
            Our mechanical keyboard fidgets are coming soon.
        </p>

    </main>


</body>

</html>
